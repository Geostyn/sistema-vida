services:
  - type: web
    name: sistema-vida-bot
    runtime: python
    buildCommand: pip install -r requirements_vida.txt
    startCommand: python vida_bot.py
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: APP_URL
        sync: false
